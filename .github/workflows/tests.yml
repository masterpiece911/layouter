name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: PYTHONPATH=src python -m unittest discover -s tests
  react:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci --prefix react
      - run: npm test --prefix react
      - run: python scripts/build_react_runtime.py
      - run: PYTHONPATH=src python -m unittest discover -s tests
  release:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: '${{ matrix.runner }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: make release PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: 'layouter-release-${{ matrix.runner }}'
          path: dist/
