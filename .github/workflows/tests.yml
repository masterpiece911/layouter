name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: PYTHONPATH=src python -m unittest discover -s tests
  react:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci --prefix react
      - run: npm test --prefix react
      - run: python scripts/build_react_runtime.py
      - run: PYTHONPATH=src python -m unittest discover -s tests
  release:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: '${{ matrix.runner }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: make release PYTHON=python
      - uses: actions/upload-artifact@v4
        with:
          name: 'layouter-release-${{ matrix.runner }}'
          path: dist/
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, react, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: layouter-release-ubuntu-24.04
          path: dist/
      - name: Verify release tag and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match the package version'
          notes = pathlib.Path('CHANGELOG.md').read_text().split('\n', 2)[2]
          pathlib.Path('release-notes.md').write_text(notes)
          PY
          cd dist
          sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "Layouter $RELEASE_TAG" \
            --notes-file release-notes.md
